<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BrewStation – PlayStation homebrew and modding hub</title>
<style>
:root{--g:#00ff66;--bg:#020402;--side:#050b05;--card:#040d06;--bd:#0a3f1e;--dim:#1fa85a;--on:#000;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="amber"]{--g:#ffb000;--bg:#040300;--side:#0b0800;--card:#0a0700;--bd:#4a3300;--dim:#b07a00}
:root[data-theme="blue"]{--g:#4fc3ff;--bg:#02060a;--side:#050c12;--card:#040a10;--bd:#0d3550;--dim:#2a8abf}
:root[data-theme="purple"]{--g:#c792ff;--bg:#06030a;--side:#0b0612;--card:#09050f;--bd:#3a2260;--dim:#8a62c4}
:root[data-theme="soft"]{--g:#c9d1d9;--bg:#14161a;--side:#181b20;--card:#1b1e24;--bd:#2d333b;--dim:#8b949e;--on:#14161a}
:root[data-theme="light"]{--g:#14532d;--bg:#f6f7f2;--side:#eaefe9;--card:#fff;--bd:#bfd3c6;--dim:#4d6b58;--on:#fff;color-scheme:light}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--g);font:14px/1.55 "Courier New",Courier,monospace;display:flex;overflow:hidden}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:99;background:linear-gradient(rgba(0,0,0,0) 50%,rgba(0,0,0,.22) 50%);background-size:100% 3px}
:root[data-theme="soft"] body::after,:root[data-theme="light"] body::after{display:none}
a{color:var(--g)}
:focus-visible{outline:2px solid var(--g);outline-offset:2px}
.glow{text-shadow:0 0 8px color-mix(in srgb,var(--g) 55%,transparent)}
aside{width:280px;flex:none;background:var(--side);border-right:1px solid var(--bd);display:flex;flex-direction:column;z-index:50}
.brand{padding:14px 16px;border-bottom:1px solid var(--bd)}
.brand b{font-size:18px;letter-spacing:3px}.brand small{display:block;color:var(--dim);font-size:11px}
.search{padding:10px;border-bottom:1px solid var(--bd)}
input,select,textarea{font:inherit;color:var(--g);background:var(--bg);border:1px solid var(--bd);border-radius:4px;padding:7px 9px;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--g);outline:0}
#chs{flex:1;overflow-y:auto;padding:8px}
.cath{width:100%;display:flex;justify-content:space-between;background:none;border:0;color:var(--dim);font:bold 11px "Courier New",monospace;letter-spacing:1px;padding:8px 6px;cursor:pointer;text-align:left}
.ch{display:flex;justify-content:space-between;text-decoration:none;color:var(--dim);padding:5px 10px;border-radius:4px;font-size:13px}
.ch:hover{color:var(--g);background:color-mix(in srgb,var(--g) 10%,transparent)}
.ch.on{background:var(--g);color:var(--on);font-weight:bold}
.ch i{font-style:normal;font-size:11px;border:1px solid currentColor;border-radius:8px;padding:0 6px}
#own{padding:12px;border-top:1px solid var(--bd);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
main{flex:1;min-width:0;display:flex;flex-direction:column;height:100%}
.top{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--bd);background:var(--side)}
.top h2{margin:0;font-size:16px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top select{width:auto}
#menu{display:none}
.view{flex:1;overflow-y:auto;padding:22px;max-width:960px;width:100%;margin:0 auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:16px;margin-bottom:14px;box-shadow:0 0 12px color-mix(in srgb,var(--g) 10%,transparent)}
.card:hover{border-color:var(--g)}
.card h3,.card h4{margin:0 0 6px}
.mut{color:var(--dim);font-size:12px}
.tag{border:1px solid var(--g);border-radius:4px;padding:0 7px;font-size:11px}
.b,.btn{display:inline-block;background:var(--bg);color:var(--g);border:1.5px solid var(--g);border-radius:4px;padding:7px 14px;font:bold 12px "Courier New",monospace;cursor:pointer;text-decoration:none;margin:3px 0}
.b:hover,.btn:hover,.b.on{background:var(--g);color:var(--on)}
.req{border:2px solid var(--g);border-radius:6px;padding:14px;margin:18px 0}
.req ul{list-style:none;margin:0;padding:0}
.req li{display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap;border-top:1px dashed var(--bd);padding:8px 0}
.req li:first-child{border:0}.req small{display:block;color:var(--dim)}
.body h3{margin:18px 0 6px}.body p,.body li,.note p{color:color-mix(in srgb,var(--g) 85%,var(--bg))}
.form{display:grid;gap:12px}.form label{display:grid;gap:4px;font-weight:bold}
.form textarea{min-height:200px;resize:vertical}
.rrow{display:grid;grid-template-columns:1fr 1.4fr 1fr auto;gap:6px}
.status{border-top:1px solid var(--bd);background:var(--side);padding:8px 16px;font-size:12px;color:var(--dim);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
#bd{display:none}
@media(max-width:800px){
 aside{position:fixed;inset:0 auto 0 0;transform:translateX(-100%);transition:transform .25s;padding-top:env(safe-area-inset-top,0px)}
 aside.open{transform:none}
 #bd.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:40}
 #menu{display:inline-block}
 .rrow{grid-template-columns:1fr}
}
/*roles*/.chip{display:inline-block;border:1px solid currentColor;border-radius:10px;padding:0 8px;font-size:11px;margin:2px 0}.x{background:none;border:0;color:inherit;cursor:pointer;font:inherit;padding:0 0 0 4px}.perms{display:grid;gap:6px}.perms label{display:flex;gap:8px;font-weight:normal}input[type=checkbox]{width:auto}input[type=color]{padding:2px;height:36px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="bd"></div>
<aside id="side">
  <div class="brand"><b class="glow">BREWSTATION</b><small>PlayStation homebrew hub</small></div>
  <div class="search"><input id="q" placeholder="Search channels…" aria-label="Search channels"></div>
  <div id="chs"></div>
  <div id="own"></div>
</aside>
<main>
  <header class="top">
    <button class="b" id="menu" aria-label="Open channels">☰</button>
    <h2 id="ct" class="glow"># announcements</h2>
    <select id="theme" aria-label="Color theme"><option value="green">Theme: Green</option><option value="amber">Amber</option><option value="blue">Blue</option><option value="purple">Purple</option><option value="soft">Soft grey</option><option value="light">Light</option></select>
  </header>
  <div class="view" id="view"></div>
  <footer class="status">
    <span>BrewStation • Not affiliated with Sony Interactive Entertainment. Use only on hardware you own. Modding can brick your console.</span>
    <a href="https://discord.gg/YOURINVITE" target="_blank" rel="noopener">Join our Discord community</a>
  </footer>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(function(){

  var sb=null;
  try{if(SUPABASE_URL.indexOf('YOUR-')<0&&window.supabase)sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY)}catch(e){}

  var T={general:['General discussion about {C}.','chat'],homebrew:['Homebrew, tools and apps for {C}.','dev'],emulation:['Emulation and compatibility for {C}.','emu'],help:['Troubleshooting and setup help for {C}.','support'],resources:['Files, guides and tools for {C}.','files'],hardware:['Repairs and hardware mods for {C}.','hardware'],marketplace:['Buy, sell or trade {C} gear and accessories.','trade']};

   {n:'PLAYSTATION 1 (PS1)',k:'ps1',c:'PS1',ch:['general','homebrew','emulation','help','resources','marketplace']},

   {n:'PLAYSTATION PORTABLE (PSP)',k:'psp',c:'PSP',ch:['general','homebrew','emulation','help','resources','marketplace']},
   {n:'PLAYSTATION 3 (PS3)',k:'ps3',c:'PS3',ch:['general','homebrew','emulation','help','resources',['cfw','Custom firmware, hCFW and diagnostics.','cfw'],['hen','Homebrew Enabler for non-CFW models.','hen'],'hardware',['badwdsd','Advanced debugging and system tinkering.','advanced'],'marketplace']},
   {n:'PLAYSTATION VITA (PSV)',k:'psv',c:'PS Vita',ch:['general','homebrew','emulation','help','resources',['henkaku','Enso, HenKaku and exploit chains.','exploit'],'hardware','marketplace']},
   {n:'PLAYSTATION 4 (PS4)',k:'ps4',c:'PS4',ch:['general','homebrew','emulation','help','resources',['mira','Mira project and debugging tools.','debug'],['hen','Homebrew Enabler discussion.','hen'],'hardware',['webkit','Browser exploit research.','exploit'],['goldhen','GoldHEN features, cheats and plugins.','essential'],'marketplace']},

  ],CH=[];

    var o={id:c.k?c.k+'-'+s:s,desc:d,badge:b,cat:c.n};c.list.push(o);CH.push(o)})});
  function chan(id){return CH.filter(function(x){return x.id===id})[0]}
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function inl(s){return esc(s).replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')}

  function find(id){return P.filter(function(g){return g.id===id})[0]}

  function topOf(uid){var pr=PR[uid];if(pr&&pr.is_owner)return{name:'Owner',color:'#f1c40f',pos:1000};var best=null;MR.forEach(function(m){if(m.user_id!==uid)return;var r=R.filter(function(x){return x.id===m.role_id})[0];if(r&&(!best||r.pos>best.pos))best=r});return best}

      render()})

  function side(){
    var o='',f=q.toLowerCase();

      var L=c.list.filter(function(x){return !f||x.id.indexOf(f)>-1||x.desc.toLowerCase().indexOf(f)>-1});if(!L.length)return;

    $('own').innerHTML=w;
  }
  function reqRow(r){r=r||{};return '<div class="rrow"><input placeholder="Homebrew name" value="'+esc(r.name)+'" aria-label="Name"><input placeholder="https://download-link" value="'+esc(r.url)+'" aria-label="Link"><input placeholder="Note (version, mirror)" value="'+esc(r.note)+'" aria-label="Note"><button type="button" class="b" data-rm>Remove</button></div>'}
  function chanOpts(v){return CATS.map(function(c){

  function formHtml(g){g=g||{req:[{}],channel:cur};
    return '<div class="card form"><label>Channel<select id="f-c">'+chanOpts(g.channel)+'</select></label>'

    return o}
  function render(){
    var h=location.hash,isM=h==='#members',p=/^#p-/.test(h)?find(h.slice(3)):null,m=/^#c-(.+)/.exec(h);
    if(p)cur=p.channel;else if(m&&chan(m[1]))cur=m[1];
    var ch=chan(cur),o='';
    $('ct').textContent=isM?'Members and roles':'# '+cur;
    if(av&&(av!=='pw'||user))o=authHtml();
    else if(form!==null){var c0=form==='new'?null:find(form);o='<h3>'+(c0?'Edit post':'New post')+'</h3>'+formHtml(c0)}
    else if(isM)o=membersHtml();
    else if(p){
      o='<p><a href="#c-'+p.channel+'">&lt; Back to #'+esc(p.channel)+'</a></p><div class="card"><h2 class="glow" style="margin-top:0">'+esc(p.title)+'</h2><div class="mut">'+who(p.author_id,p.author)+' • '+esc(p.date)+' • #'+esc(p.channel)+'</div><p>'+inl(p.summary)+'</p>';
      if(p.req&&p.req.length)o+='<div class="req"><h4 style="margin:0 0 8px">Required homebrew</h4><ul>'+p.req.map(function(r){var u=safe(r.url);return '<li><span>'+esc(r.name)+(r.note?'<small>'+esc(r.note)+'</small>':'')+'</span>'+(u?'<a class="btn" href="'+u+'" target="_blank" rel="noopener">Get it</a>':'')+'</li>'}).join('')+'</ul></div>';
      o+='<div class="body">'+md(p.body)+'</div>'+(p.notes?'<div class="note"><h3>Notes and troubleshooting</h3>'+md(p.notes)+'</div>':'')+'</div>';
      if(canMod(p))o+='<button class="b" data-edit="'+esc(p.id)+'">Edit post</button> <button class="b" data-del="'+esc(p.id)+'">Delete post</button> <span class="mut">'+esc(msg)+'</span>';
    }else{
      var L=P.filter(function(x){return x.channel===cur}),hint=canPost(cur)?'You can post here.':!user?'Sign up or log in to post here.':!confirmed()?'Confirm your email to post.':'Posting here is limited to staff roles.';
      o='<div class="card"><div class="mut">'+esc(ch.cat)+'</div><h3 class="glow"># '+esc(ch.id)+' <span class="tag">'+esc(ch.badge)+'</span></h3><p class="mut" style="margin:0">'+esc(ch.desc)+'</p><p class="mut">'+hint+'</p></div>';
      o+=L.length?L.map(postCard).join(''):'<div class="card mut">No posts in this channel yet.</div>';
      if(msg)o+='<p class="mut">'+esc(msg)+'</p>';
    }
    $('view').innerHTML=o;side();
  }
  document.addEventListener('click',function(e){
    if(e.target.id==='bd'||e.target.id==='menu'||e.target.closest('a.ch,a.btn[href="#members"]')){var s=$('side').classList;if(e.target.id==='menu')s.add('open');else s.remove('open');$('bd').classList.toggle('open',e.target.id==='menu')}
    var t=e.target.closest('button');if(!t)return;var d=t.dataset;
    if(d.cat!==undefined){col[d.cat]=!col[d.cat];side()}
    if(t.hasAttribute('data-login')){av='login';msg='';render()}
    if(t.hasAttribute('data-signup')){av='signup';msg='';render()}
    if(t.hasAttribute('data-pw')){av='pw';msg='';render()}
    if(t.hasAttribute('data-logout')){av=null;form=null;sb.auth.signOut().then(function(){user=null;calc();msg='';render()})}
    if(t.id==='f-no'){av=null;msg='';render()}
    if(t.id==='f-login'){setMsg('Signing in…');sb.auth.signInWithPassword({email:$('f-e').value.trim(),password:$('f-p').value}).then(function(r){
      if(r.error)setMsg(/confirm/i.test(r.error.message)?'Confirm your email first, then log in.':'Wrong email or password.');else{av=null;msg='';user=r.data.user;loadMeta()}})}
    if(t.id==='f-signup'){
      var un=$('f-u').value.trim(),em=$('f-e').value.trim(),a=$('f-p').value;
      if(!/^[A-Za-z0-9_]{3,20}$/.test(un)){setMsg('Username: 3-20 letters, numbers or _.');return}
      if(!em){setMsg('Enter your email.');return}
      if(a.length<8){setMsg('Use at least 8 characters.');return}
      if(a!==$('f-p2').value){setMsg('The passwords do not match.');return}
      setMsg('Creating account…');
      sb.auth.signUp({email:em,password:a,options:{data:{username:un},emailRedirectTo:location.origin+location.pathname}}).then(function(r){
        if(r.error){setMsg('Could not sign up: '+r.error.message);return}
        if(r.data.session){av=null;msg='';user=r.data.user;loadMeta()}else setMsg('Account created. Check your email to confirm it, then log in.')})}
    if(t.id==='f-forgot'){var fe=$('f-e').value.trim();if(!fe){setMsg('Type your email first.');return}
      sb.auth.resetPasswordForEmail(fe,{redirectTo:location.origin+location.pathname}).then(function(r){setMsg(r.error?'Could not send the email: '+r.error.message:'If that email has an account, a reset link is on its way.')})}
    if(t.id==='f-pwsave'){var a1=$('f-p').value;
      if(a1.length<8){setMsg('Use at least 8 characters.');return}
      if(a1!==$('f-p2').value){setMsg('The passwords do not match.');return}
      sb.auth.updateUser({password:a1}).then(function(r){if(r.error)setMsg('Could not change password: '+r.error.message);else{av=null;msg='Password changed.';render()}})}
    if(t.hasAttribute('data-new')&&canPost(cur)){form='new';msg='';render()}
    if(d.edit){var ep=find(d.edit);if(ep&&canMod(ep)){form=d.edit;msg='';render()}}
    if(t.id==='f-cancel'){form=null;msg='';render()}
    if(t.id==='f-add')$('f-r').insertAdjacentHTML('beforeend',reqRow());
    if(t.hasAttribute('data-rm'))t.parentNode.remove();
    if(d.del){var dp=find(d.del);if(!dp||!canMod(dp))return;
      if(delAsk===dp.id){delAsk='';sb.from('posts').delete().eq('id',dp.id).then(function(r){msg=r.error?'Could not delete: '+r.error.message:'';location.hash='c-'+dp.channel;load()})}
      else{delAsk=dp.id;msg='Click Delete post again to confirm.';render()}}
    if(t.id==='f-save'){
      var ch=$('f-c').value;if(!canPost(ch)){setMsg('You cannot post in that channel.');return}
      var title=$('f-t').value.trim();if(!title){setMsg('Add a title first.');return}
      var req=[].map.call(document.querySelectorAll('#f-r .rrow'),function(r){var i=r.querySelectorAll('input');return{name:i[0].value.trim(),url:i[1].value.trim(),note:i[2].value.trim()}}).filter(function(r){return r.name||r.url});
      var c1=form==='new'?null:find(form),row={channel:ch,title:title,summary:$('f-s').value.trim(),req:req,body:$('f-b').value,notes:$('f-n').value};
      setMsg('Publishing…');
      var rq=c1?sb.from('posts').update(row).eq('id',c1.id).select().maybeSingle():sb.from('posts').insert(row).select().single();
      rq.then(function(r){
        if(r.error||!r.data){setMsg('Could not save: '+(r.error?r.error.message:'not allowed'));return}
        form=null;msg='';load().then(function(){location.hash='p-'+r.data.id})})}
    if(d.addrole){var sl=$('ar-'+d.addrole);sb.from('member_roles').insert({user_id:d.addrole,role_id:sl.value}).then(function(r){msg=r.error?'Could not add role: '+r.error.message:'Role added.';loadMeta()})}
    if(d.rmrole){var pr2=d.rmrole.split('|');sb.from('member_roles').delete().eq('user_id',pr2[0]).eq('role_id',pr2[1]).then(function(r){msg=r.error?'Could not remove role: '+r.error.message:'Role removed.';loadMeta()})}
    if(d.delrole){if(delAsk===d.delrole){delAsk='';sb.from('roles').delete().eq('id',d.delrole).then(function(r){msg=r.error?'Could not delete role: '+r.error.message:'Role deleted.';loadMeta()})}else{delAsk=d.delrole;setMsg('Click Delete role again to confirm.')}}
    if(t.hasAttribute('data-mkrole')){
      var nm=$('r-n').value.trim(),clr=$('r-c').value,ps=parseInt($('r-p').value,10),pl=[].filter.call(document.querySelectorAll('.rp'),function(c){return c.checked}).map(function(c){return c.value});
      if(!nm){setMsg('Give the role a name.');return}
      if(!(ps>=1&&ps<myTop)){setMsg('Position must be between 1 and '+(myTop-1)+'.');return}
      sb.from('roles').insert({name:nm,color:clr,pos:ps,perms:pl}).then(function(r){msg=r.error?'Could not create role: '+r.error.message:'Role created.';loadMeta()})}
  });
  document.addEventListener('input',function(e){if(e.target.id==='mq'){mq=e.target.value;render();var i=$('mq');i.focus();i.setSelectionRange(mq.length,mq.length)}});
  $('q').addEventListener('input',function(){q=this.value;side()});
  var sel=$('theme'),TH=['green','amber','blue','purple','soft','light'];
  function setTheme(t){if(TH.indexOf(t)<0)t='green';document.documentElement.setAttribute('data-theme',t);sel.value=t}
  var sv='green';try{sv=localStorage.getItem('bs-theme')||'green'}catch(e){}
  setTheme(sv);
  sel.addEventListener('change',function(){setTheme(sel.value);try{localStorage.setItem('bs-theme',sel.value)}catch(e){}});
  window.addEventListener('hashchange',function(){form=null;if(av!=='pw')av=null;msg='';render();$('view').scrollTop=0});
  render();load();
  if(sb){
    sb.auth.getSession().then(function(r){user=r.data.session?r.data.session.user:null;calc();render()});
    sb.auth.onAuthStateChange(function(ev,s){user=s?s.user:null;if(ev==='SIGNED_OUT')av=null;if(ev==='PASSWORD_RECOVERY')av='pw';setTimeout(function(){calc();render()},0)});
    loadMeta();
    sb.channel('live').on('postgres_changes',{event:'*',schema:'public',table:'posts'},load).on('postgres_changes',{event:'*',schema:'public',table:'member_roles'},loadMeta).on('postgres_changes',{event:'*',schema:'public',table:'roles'},loadMeta).on('postgres_changes',{event:'*',schema:'public',table:'profiles'},loadMeta).subscribe();
  }
})();
</script>
</body>
</html>
