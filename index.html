    }else{

    $('view').innerHTML=o;side();nav2();

  document.addEventListener('click',function(e){

    if(d.ban){var bh=$('bd-'+d.ban).value;sb.from('bans').upsert({user_id:d.ban,reason:($('br-'+d.ban).value||'').trim(),until:bh==='perm'?null:new Date(Date.now()+parseInt(bh,10)*3600000).toISOString()}).then(function(r){msg=r.error?'Could not apply: '+r.error.message:'Applied.';loadMeta()})}
