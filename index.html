<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BrewStation – PlayStation homebrew and modding hub</title>
<style>
:root{--g:#00ff66;--bg:#020402;--side:#050b05;--card:#040d06;--bd:#0a3f1e;--dim:#1fa85a;--on:#000;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="amber"]{--g:#ffb000;--bg:#040300;--side:#0b0800;--card:#0a0700;--bd:#4a3300;--dim:#b07a00}
:root[data-theme="blue"]{--g:#4fc3ff;--bg:#02060a;--side:#050c12;--card:#040a10;--bd:#0d3550;--dim:#2a8abf}
:root[data-theme="purple"]{--g:#c792ff;--bg:#06030a;--side:#0b0612;--card:#09050f;--bd:#3a2260;--dim:#8a62c4}
:root[data-theme="soft"]{--g:#c9d1d9;--bg:#14161a;--side:#181b20;--card:#1b1e24;--bd:#2d333b;--dim:#8b949e;--on:#14161a}
:root[data-theme="light"]{--g:#14532d;--bg:#f6f7f2;--side:#eaefe9;--card:#fff;--bd:#bfd3c6;--dim:#4d6b58;--on:#fff;color-scheme:light}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--g);font:14px/1.55 "Courier New",Courier,monospace;display:flex;overflow:hidden}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:99;background:linear-gradient(rgba(0,0,0,0) 50%,rgba(0,0,0,.22) 50%);background-size:100% 3px}
:root[data-theme="soft"] body::after,:root[data-theme="light"] body::after{display:none}
a{color:var(--g)}
:focus-visible{outline:2px solid var(--g);outline-offset:2px}
.glow{text-shadow:0 0 8px color-mix(in srgb,var(--g) 55%,transparent)}
aside{width:280px;flex:none;background:var(--side);border-right:1px solid var(--bd);display:flex;flex-direction:column;z-index:50}
.brand{padding:14px 16px;border-bottom:1px solid var(--bd)}
.brand b{font-size:18px;letter-spacing:3px}.brand small{display:block;color:var(--dim);font-size:11px}
.search{padding:10px;border-bottom:1px solid var(--bd)}
input,select,textarea{font:inherit;color:var(--g);background:var(--bg);border:1px solid var(--bd);border-radius:4px;padding:7px 9px;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--g);outline:0}
#chs{flex:1;overflow-y:auto;padding:8px}
.cath{width:100%;display:flex;justify-content:space-between;background:none;border:0;color:var(--dim);font:bold 11px "Courier New",monospace;letter-spacing:1px;padding:8px 6px;cursor:pointer;text-align:left}
.ch{display:flex;justify-content:space-between;text-decoration:none;color:var(--dim);padding:5px 10px;border-radius:4px;font-size:13px}
.ch:hover{color:var(--g);background:color-mix(in srgb,var(--g) 10%,transparent)}
.ch.on{background:var(--g);color:var(--on);font-weight:bold}
.ch i{font-style:normal;font-size:11px;border:1px solid currentColor;border-radius:8px;padding:0 6px}
#own{padding:12px;border-top:1px solid var(--bd);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
main{flex:1;min-width:0;display:flex;flex-direction:column;height:100%}
.top{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--bd);background:var(--side)}
.top h2{margin:0;font-size:16px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top select{width:auto}
#menu{display:none}
.view{flex:1;overflow-y:auto;padding:22px;max-width:960px;width:100%;margin:0 auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:16px;margin-bottom:14px;box-shadow:0 0 12px color-mix(in srgb,var(--g) 10%,transparent)}
.card:hover{border-color:var(--g)}
.card h3,.card h4{margin:0 0 6px}
.mut{color:var(--dim);font-size:12px}
.tag{border:1px solid var(--g);border-radius:4px;padding:0 7px;font-size:11px}
.b,.btn{display:inline-block;background:var(--bg);color:var(--g);border:1.5px solid var(--g);border-radius:4px;padding:7px 14px;font:bold 12px "Courier New",monospace;cursor:pointer;text-decoration:none;margin:3px 0}
.b:hover,.btn:hover,.b.on{background:var(--g);color:var(--on)}
.req{border:2px solid var(--g);border-radius:6px;padding:14px;margin:18px 0}
.req ul{list-style:none;margin:0;padding:0}
.req li{display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap;border-top:1px dashed var(--bd);padding:8px 0}
.req li:first-child{border:0}.req small{display:block;color:var(--dim)}
.body h3{margin:18px 0 6px}.body p,.body li,.note p{color:color-mix(in srgb,var(--g) 85%,var(--bg))}
.form{display:grid;gap:12px}.form label{display:grid;gap:4px;font-weight:bold}
.form textarea{min-height:200px;resize:vertical}
.rrow{display:grid;grid-template-columns:1fr 1.4fr 1fr auto;gap:6px}
.status{border-top:1px solid var(--bd);background:var(--side);padding:8px 16px;font-size:12px;color:var(--dim);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
#bd{display:none}
@media(max-width:800px){
 aside{position:fixed;inset:0 auto 0 0;transform:translateX(-100%);transition:transform .25s;padding-top:env(safe-area-inset-top,0px)}
 aside.open{transform:none}
 #bd.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:40}
 #menu{display:inline-block}
 .rrow{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="bd"></div>
<aside id="side">
  <div class="brand"><b class="glow">BREWSTATION</b><small>PlayStation homebrew hub</small></div>
  <div class="search"><input id="q" placeholder="Search channels…" aria-label="Search channels"></div>
  <div id="chs"></div>
  <div id="own"></div>
</aside>
<main>
  <header class="top">
    <button class="b" id="menu" aria-label="Open channels">☰</button>
    <h2 id="ct" class="glow"># announcements</h2>
    <select id="theme" aria-label="Color theme"><option value="green">Theme: Green</option><option value="amber">Amber</option><option value="blue">Blue</option><option value="purple">Purple</option><option value="soft">Soft grey</option><option value="light">Light</option></select>
  </header>
  <div class="view" id="view"></div>
  <footer class="status">
    <span>BrewStation • Not affiliated with Sony Interactive Entertainment. Use only on hardware you own. Modding can brick your console.</span>
    <a href="https://discord.gg/YOURINVITE" target="_blank" rel="noopener">Join our Discord community</a>
  </footer>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(function(){
  /* ===== SETUP: paste your Supabase values (Project Settings > API). The anon key is meant to be public. ===== */
  var SUPABASE_URL='https://ggaxfvgtpkwhdakemilb.supabase.co/rest/v1/',SUPABASE_KEY='sb_publishable_xQl9tuaLtxUz81gD6LUsSA_qYooURVs';
  var sb=null;
  try{if(SUPABASE_URL.indexOf('YOUR-')<0&&window.supabase)sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY)}catch(e){}
  var $=function(i){return document.getElementById(i)};
  var P=[],user=null,me=null,form=null,lg=false,pw=false,msg='',delAsk='',q='',col={},cur='announcements';
  var DEMO=[{id:'demo',channel:'announcements',title:'Site setup needed',author:'BrewStation Team',date:'2026-11-15',summary:'Add your Supabase details to index.html to turn on posts and staff logins.',req:[],body:'## Next step\nFollow the README that came with this site.',notes:'',author_id:null}];
  var T={general:['General discussion about {C}.','chat'],homebrew:['Homebrew, tools and apps for {C}.','dev'],emulation:['Emulation and compatibility for {C}.','emu'],help:['Troubleshooting and setup help for {C}.','support'],resources:['Files, guides and tools for {C}.','files'],hardware:['Repairs and hardware mods for {C}.','hardware'],marketplace:['Buy, sell or trade {C} gear and accessories.','trade']};
  var CATS=[
   {n:'GENERAL / COMMUNITY',k:'',c:'',ch:[['announcements','Official news, updates and releases from the BrewStation team.','official'],['rules','Server guidelines, safety and community conduct.','read-first'],['community-videos','Showcases and tutorials from our community.','media'],['wall-of-idiots','Hall of fame for funny soft-brick fails.','fun']]},
   {n:'PLAYSTATION 1 (PS1)',k:'ps1',c:'PS1',ch:['general','homebrew','emulation','help','resources','marketplace']},
   {n:'PLAYSTATION 2 (PS2)',k:'ps2',c:'PS2',ch:['general','homebrew',['opl','Open PS2 Loader setup, SMB and HDD support.','essential'],'emulation','help','resources','marketplace']},
   {n:'PLAYSTATION PORTABLE (PSP)',k:'psp',c:'PSP',ch:['general','homebrew','emulation','help','resources','marketplace']},
   {n:'PLAYSTATION 3 (PS3)',k:'ps3',c:'PS3',ch:['general','homebrew','emulation','help','resources',['cfw','Custom firmware, hCFW and diagnostics.','cfw'],['hen','Homebrew Enabler for non-CFW models.','hen'],'hardware',['badwdsd','Advanced debugging and system tinkering.','advanced'],'marketplace']},
   {n:'PLAYSTATION VITA (PSV)',k:'psv',c:'PS Vita',ch:['general','homebrew','emulation','help','resources',['henkaku','Enso, HenKaku and exploit chains.','exploit'],'hardware','marketplace']},
   {n:'PLAYSTATION 4 (PS4)',k:'ps4',c:'PS4',ch:['general','homebrew','emulation','help','resources',['mira','Mira project and debugging tools.','debug'],['hen','Homebrew Enabler discussion.','hen'],'hardware',['webkit','Browser exploit research.','exploit'],['goldhen','GoldHEN features, cheats and plugins.','essential'],'marketplace']},
   {n:'PLAYSTATION 5 (PS5)',k:'ps5',c:'PS5',ch:['general','homebrew','emulation','help','resources',['etahen','EtaHEN payload setup.','payload'],'hardware',['exploits','Kernel exploits and vulnerability research.','security'],'marketplace']},
   {n:'PLAYSTATION PORTAL',k:'psportal',c:'PS Portal',ch:['general','homebrew','help','resources','hardware','marketplace']}
  ],CH=[];
  CATS.forEach(function(c){c.list=[];c.ch.forEach(function(x){var s,d,b;
    if(typeof x==='string'){s=x;d=T[x][0].replace('{C}',c.c);b=T[x][1]}else{s=x[0];d=x[1];b=x[2]}
    var o={id:c.k?c.k+'-'+s:s,desc:d,badge:b,cat:c.n};c.list.push(o);CH.push(o)})});
  function chan(id){return CH.filter(function(x){return x.id===id})[0]}
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function inl(s){return esc(s).replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')}
  function safe(u){return /^https?:\/\//i.test(u)?esc(u):''}
  function md(t){var o='',ul=false;String(t||'').split('\n').forEach(function(l){
    var li=/^- (.*)/.exec(l),h=/^## (.*)/.exec(l);
    if(!li&&ul){o+='</ul>';ul=false}
    if(li){if(!ul){o+='<ul>';ul=true}o+='<li>'+inl(li[1])+'</li>'}
    else if(h)o+='<h3>'+inl(h[1])+'</h3>';
    else if(l.trim())o+='<p>'+inl(l)+'</p>'});
    return o+(ul?'</ul>':'')}
  function find(id){return P.filter(function(g){return g.id===id})[0]}
  function cnt(id){return P.filter(function(p){return p.channel===id}).length}
  function canPost(){return !!(sb&&user&&me&&!me.must_change)}
  function canMod(p){return canPost()&&(me.role==='owner'||p.author_id===user.id)}
  function load(){
    if(!sb){P=DEMO;render();return Promise.resolve()}
    return sb.from('posts').select('*').order('created_at',{ascending:false}).then(function(r){
      if(r.error){msg='Could not load posts.'}else{P=r.data.map(function(p){p.date=String(p.created_at).slice(0,10);p.req=p.req||[];return p})}
      render()})
  }
  function loadMe(){
    if(!sb||!user){me=null;pw=false;render();return Promise.resolve()}
    return sb.from('staff').select('role,must_change').eq('id',user.id).maybeSingle().then(function(r){
      me=r.data||null;
      if(!me){msg='This account is not a staff account.';sb.auth.signOut()}else if(me.must_change)pw=true;
      render()})
  }
  function side(){
    var o='',f=q.toLowerCase();
    CATS.forEach(function(c,i){
      var L=c.list.filter(function(x){return !f||x.id.indexOf(f)>-1||x.desc.toLowerCase().indexOf(f)>-1});if(!L.length)return;
      o+='<div><button class="cath" data-cat="'+i+'"><span>'+esc(c.n)+'</span><span>'+(col[i]&&!f?'+':'–')+'</span></button>'+(col[i]&&!f?'':L.map(function(x){var n=cnt(x.id);return '<a class="ch'+(x.id===cur?' on':'')+'" href="#c-'+x.id+'"><span># '+esc(x.id)+'</span>'+(n?'<i>'+n+'</i>':'')+'</a>'}).join(''))+'</div>'});
    $('chs').innerHTML=o||'<p class="mut">No channels match.</p>';
    var w='';
    if(!sb)w='<span class="mut">Setup needed</span>';
    else if(!user||!me)w='<button class="b" data-login>Staff login</button>';
    else{w='<span class="mut" style="width:100%">'+esc(user.email)+' ('+esc(me.role)+')</span>';
      if(canPost())w+='<button class="b on" data-new>+ New post</button>';
      w+='<button class="b" data-pw>Change password</button><button class="b" data-logout>Log out</button>'}
    $('own').innerHTML=w;
  }
  function reqRow(r){r=r||{};return '<div class="rrow"><input placeholder="Homebrew name" value="'+esc(r.name)+'" aria-label="Name"><input placeholder="https://download-link" value="'+esc(r.url)+'" aria-label="Link"><input placeholder="Note (version, mirror)" value="'+esc(r.note)+'" aria-label="Note"><button type="button" class="b" data-rm>Remove</button></div>'}
  function chanOpts(v){return CATS.map(function(c){return '<optgroup label="'+esc(c.n)+'">'+c.list.map(function(x){return '<option value="'+x.id+'"'+(x.id===v?' selected':'')+'>#'+x.id+'</option>'}).join('')+'</optgroup>'}).join('')}
  function formHtml(g){g=g||{req:[{}],author:'BrewStation Team',channel:cur};
    return '<div class="card form"><label>Channel<select id="f-c">'+chanOpts(g.channel)+'</select></label>'
    +'<label>Title<input id="f-t" value="'+esc(g.title)+'"></label>'
    +'<label>Author<input id="f-a" value="'+esc(g.author)+'"></label>'
    +'<label>Short description<input id="f-s" value="'+esc(g.summary)+'"></label>'
    +'<div><b>Required homebrew (with links)</b><div id="f-r" style="display:grid;gap:8px;margin:6px 0">'+(g.req&&g.req.length?g.req:[{}]).map(reqRow).join('')+'</div><button type="button" class="b" id="f-add">Add homebrew link</button></div>'
    +'<label>Content<textarea id="f-b" placeholder="## Step 1: Title&#10;Describe the step&#10;- List item&#10;[link text](https://example.com)">'+esc(g.body)+'</textarea></label>'
    +'<label>Notes and troubleshooting<textarea id="f-n" style="min-height:90px">'+esc(g.notes)+'</textarea></label>'
    +'<div><button class="b on" id="f-save" type="button">Publish post</button> <button class="b" id="f-cancel" type="button">Cancel</button></div>'
    +'<span class="mut">Use ## for headings, - for lists and [text](url) for links. Posts go live for everyone at once.</span></div>'}
  function loginHtml(){return '<div class="card form"><h3>Staff login</h3><span class="mut">No account? Ask the owner for a temporary password.</span><label>Email<input id="f-e" type="email" autocomplete="username"></label><label>Password<input id="f-p" type="password" autocomplete="current-password"></label><div><button class="b on" id="f-login" type="button">Log in</button> <button class="b" id="f-no" type="button">Cancel</button></div><span class="mut">'+esc(msg)+'</span></div>'}
  function pwHtml(){var forced=me&&me.must_change;return '<div class="card form"><h3>'+(forced?'Choose your own password':'Change password')+'</h3>'+(forced?'<span>You signed in with a temporary password. Pick a new one (8+ characters) to continue.</span>':'')+'<label>New password<input id="f-p" type="password" autocomplete="new-password"></label><label>Repeat new password<input id="f-p2" type="password" autocomplete="new-password"></label><div><button class="b on" id="f-pwsave" type="button">Save password</button>'+(forced?'':' <button class="b" id="f-no" type="button">Cancel</button>')+'</div><span class="mut">'+esc(msg)+'</span></div>'}
  function postCard(p){return '<div class="card"><h3><a href="#p-'+esc(p.id)+'" style="text-decoration:none">'+esc(p.title)+'</a></h3><div class="mut">'+esc(p.author)+' • '+esc(p.date)+(p.req&&p.req.length?' • <span class="tag">'+p.req.length+' required</span>':'')+'</div><p>'+inl(p.summary)+'</p><a class="btn" href="#p-'+esc(p.id)+'">Read</a></div>'}
  function render(){
    var h=location.hash,p=/^#p-/.test(h)?find(h.slice(3)):null,m=/^#c-(.+)/.exec(h);
    if(p)cur=p.channel;else if(m&&chan(m[1]))cur=m[1];
    var ch=chan(cur),o='';
    $('ct').textContent='# '+cur;
    if(pw&&user&&me)o=pwHtml();
    else if(lg&&!user)o=loginHtml();
    else if(form!==null){var c0=form==='new'?null:find(form);o='<h3>'+(c0?'Edit post':'New post')+'</h3>'+formHtml(c0)+'<span class="mut">'+esc(msg)+'</span>'}
    else if(p){
      o='<p><a href="#c-'+p.channel+'">&lt; Back to #'+esc(p.channel)+'</a></p><div class="card"><h2 class="glow" style="margin-top:0">'+esc(p.title)+'</h2><div class="mut">'+esc(p.author)+' • '+esc(p.date)+' • #'+esc(p.channel)+'</div><p>'+inl(p.summary)+'</p>';
      if(p.req&&p.req.length)o+='<div class="req"><h4 style="margin:0 0 8px">Required homebrew</h4><ul>'+p.req.map(function(r){var u=safe(r.url);return '<li><span>'+esc(r.name)+(r.note?'<small>'+esc(r.note)+'</small>':'')+'</span>'+(u?'<a class="btn" href="'+u+'" target="_blank" rel="noopener">Get it</a>':'')+'</li>'}).join('')+'</ul></div>';
      o+='<div class="body">'+md(p.body)+'</div>'+(p.notes?'<div class="note"><h3>Notes and troubleshooting</h3>'+md(p.notes)+'</div>':'')+'</div>';
      if(canMod(p))o+='<button class="b" data-edit="'+esc(p.id)+'">Edit post</button> <button class="b" data-del="'+esc(p.id)+'">Delete post</button> <span class="mut">'+esc(msg)+'</span>';
    }else{
      var L=P.filter(function(x){return x.channel===cur});
      o='<div class="card"><div class="mut">'+esc(ch.cat)+'</div><h3 class="glow"># '+esc(ch.id)+' <span class="tag">'+esc(ch.badge)+'</span></h3><p class="mut" style="margin:0">'+esc(ch.desc)+'</p></div>';
      o+=L.length?L.map(postCard).join(''):'<div class="card mut">No posts in this channel yet. Check back soon or ask in the Discord.</div>';
      if(msg)o+='<p class="mut">'+esc(msg)+'</p>';
    }
    $('view').innerHTML=o;side();
  }
  document.addEventListener('click',function(e){
    if(e.target.id==='bd'||e.target.id==='menu'||e.target.closest('a.ch')){var s=$('side').classList;if(e.target.id==='menu')s.add('open');else s.remove('open');$('bd').classList.toggle('open',e.target.id==='menu')}
    var t=e.target.closest('button');if(!t)return;
    if(t.dataset.cat!==undefined){col[t.dataset.cat]=!col[t.dataset.cat];side()}
    if(t.hasAttribute('data-login')){lg=true;msg='';render()}
    if(t.hasAttribute('data-pw')){pw=true;msg='';render()}
    if(t.hasAttribute('data-logout')){pw=false;form=null;sb.auth.signOut().then(function(){user=null;me=null;msg='';render()})}
    if(t.id==='f-no'){lg=false;pw=false;msg='';render()}
    if(t.hasAttribute('data-new')&&canPost()){form='new';render()}
    if(t.dataset.edit){form=t.dataset.edit;render()}
    if(t.id==='f-cancel'){form=null;render()}
    if(t.id==='f-add')$('f-r').insertAdjacentHTML('beforeend',reqRow());
    if(t.hasAttribute('data-rm'))t.parentNode.remove();
    if(t.id==='f-login'){
      msg='Signing in…';
      sb.auth.signInWithPassword({email:$('f-e').value.trim(),password:$('f-p').value}).then(function(r){
        if(r.error){msg='Wrong email or password.';render()}else{lg=false;msg='';user=r.data.user;loadMe()}})
    }
    if(t.id==='f-pwsave'){
      var a=$('f-p').value,b=$('f-p2').value;
      if(a.length<8){msg='Use at least 8 characters.';render();return}
      if(a!==b){msg='The passwords do not match.';render();return}
      sb.auth.updateUser({password:a}).then(function(r){
        if(r.error){msg='Could not change password: '+r.error.message;render();return}
        return sb.rpc('mark_password_changed').then(function(){pw=false;msg='Password changed.';return loadMe()})})
    }
    if(t.dataset.del){var dp=find(t.dataset.del);if(!dp||!canMod(dp))return;
      if(delAsk===dp.id){delAsk='';sb.from('posts').delete().eq('id',dp.id).then(function(r){msg=r.error?'Could not delete: '+r.error.message:'';location.hash='c-'+dp.channel;load()})}
      else{delAsk=dp.id;msg='Click Delete post again to confirm.';render()}}
    if(t.id==='f-save'&&canPost()){
      var title=$('f-t').value.trim();if(!title){msg='Add a title first.';render();return}
      var req=[].map.call(document.querySelectorAll('#f-r .rrow'),function(r){var i=r.querySelectorAll('input');return{name:i[0].value.trim(),url:i[1].value.trim(),note:i[2].value.trim()}}).filter(function(r){return r.name||r.url});
      var c1=form==='new'?null:find(form),
      row={channel:$('f-c').value,title:title,author:$('f-a').value.trim()||'BrewStation Team',summary:$('f-s').value.trim(),req:req,body:$('f-b').value,notes:$('f-n').value};
      msg='Publishing…';
      var rq=c1?sb.from('posts').update(row).eq('id',c1.id).select().maybeSingle():sb.from('posts').insert(row).select().single();
      rq.then(function(r){
        if(r.error||!r.data){msg='Could not save: '+(r.error?r.error.message:'not allowed');render();return}
        form=null;msg='';load().then(function(){location.hash='p-'+r.data.id})})
    }
  });
  $('q').addEventListener('input',function(){q=this.value;side()});
  var sel=$('theme'),TH=['green','amber','blue','purple','soft','light'];
  function setTheme(t){if(TH.indexOf(t)<0)t='green';document.documentElement.setAttribute('data-theme',t);sel.value=t}
  var sv='green';try{sv=localStorage.getItem('bs-theme')||'green'}catch(e){}
  setTheme(sv);
  sel.addEventListener('change',function(){setTheme(sel.value);try{localStorage.setItem('bs-theme',sel.value)}catch(e){}});
  window.addEventListener('hashchange',function(){form=null;lg=false;msg='';render();$('view').scrollTop=0});
  render();load();
  if(sb){
    sb.auth.getSession().then(function(r){user=r.data.session?r.data.session.user:null;return loadMe()});
    sb.auth.onAuthStateChange(function(ev,s){user=s?s.user:null;if(ev==='SIGNED_OUT'){me=null;pw=false}setTimeout(function(){if(ev!=='INITIAL_SESSION')loadMe()},0)});
    sb.channel('posts-live').on('postgres_changes',{event:'*',schema:'public',table:'posts'},function(){load()}).subscribe();
  }
})();
</script>
</body>
</html>
